<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <title>Hangar · En hızlı süreler</title>
    <style>
      :root {
        --bg: #07090d;
        --panel: #10141c;
        --line: #2a3344;
        --text: #e8edf5;
        --dim: #8b97a8;
        --osd: #9dff7a;
        --warn: #ffb020;
        --bad: #ff4d4d;
        --accent: #ff8a3d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%;
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body { padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
      .wrap { max-width: 980px; margin: 0 auto; }
      header {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 22px;
        border-bottom: 1px solid rgba(255,176,32,.25);
      }
      header .brand { display: flex; align-items: baseline; gap: 10px; }
      header .kicker { font: 11px/1 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--warn); }
      header strong { font: 800 20px/1 system-ui; letter-spacing: .1em; }
      header .back { color: var(--warn); text-decoration: none; font: 700 13px/1 system-ui; display: inline-flex; align-items: center; min-height: 40px; padding: 0 8px; margin-left: -8px; }
      .why { margin: -8px 0 22px; color: var(--dim); font-size: 14px; max-width: 62ch; }
      #status { font: 12px/1 ui-monospace, monospace; color: var(--dim); }
      #status.live { color: var(--osd); }
      #status.err { color: var(--bad); }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
      }
      .op {
        background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
        padding: 14px 14px 6px; display: flex; flex-direction: column;
      }
      .op h2 {
        margin: 0 0 2px; font-size: 15px; letter-spacing: .02em;
      }
      .op .blurb { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
      .op .runs { color: var(--dim); font: 11px/1 ui-monospace, monospace; margin-left: 6px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
      th { color: var(--dim); font-weight: 600; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      td.rank { color: var(--dim); font: 11px/1 ui-monospace, monospace; width: 24px; }
      tr:nth-child(-n+3) td.rank { color: var(--warn); font-weight: 700; }
      td.time { font: 13px/1 ui-monospace, monospace; color: var(--osd); text-align: right; }
      td.lap { color: var(--dim); }
      .empty { color: var(--dim); font-size: 12px; padding: 10px 0; }
      [hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <span class="kicker">EFA HANGAR</span>
          <strong>EN HIZLI SÜRELER</strong>
        </div>
        <a class="back" href="/">← Hangar</a>
        <span id="status">yükleniyor…</span>
      </header>
      <p class="why">Her görevde kim daha kısa sürede bitirdi. 1. sıra en hızlı. Görev bitince otomatik yazılır.</p>
      <div class="grid" id="grid"></div>
    </div>
    <script type="module" src="/src/leaderboard.js"></script>
  </body>
</html>
