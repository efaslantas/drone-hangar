<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Şile adlandırılmış harita kontrolü</title><link rel="stylesheet" href="/src/style.css"><style>body{overflow:auto;background:#0d1e26;color:#ecf3e1;padding:20px;font:14px system-ui}header{max-width:650px}header button{padding:8px;margin:3px;font:12px system-ui}header input{width:100px;display:inline-block}#sile-map-overview{width:min(650px,calc(100vw - 40px));margin-top:20px}#sile-navigation{position:fixed;top:auto;bottom:24px}#status{color:#b8dca6}#map-attribution{display:none}@media(max-width:900px){#sile-navigation{position:relative;right:auto;bottom:auto;top:auto;margin-top:15px}}</style><header><h1>Şile · mahalle ve sokak kontrolü</h1><p>Yazılım konumları; manuel uçuş ve gerçek cihaz ölçümü değildir.</p><div id="places"></div><label>X <input id="x" type="number" value="0"></label><label>Z <input id="z" type="number" value="0"></label><button id="set">Konuma git</button><button id="invalid">Geçersiz konum</button><button id="dispose">Kapat / temizle</button><button id="reset">Yeniden aç</button><p id="status">Hazırlanıyor</p></header><details id="sile-navigation" data-ui hidden></details><section id="sile-map-overview" hidden></section><script type="module" src="./sile-navigation.mjs"></script></html>
