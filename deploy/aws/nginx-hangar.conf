# Loaded at http{} scope by the host default.conf include. Separate origin/app.
map $http_upgrade $drone_hangar_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name hangar.18-153-158-209.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name hangar.18-153-158-209.sslip.io;
    ssl_certificate /etc/letsencrypt/live/drone-hangar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drone-hangar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $drone_hangar_upstream http://drone-hangar-app:8780;
    client_max_body_size 512k;
    location / {
        proxy_pass $drone_hangar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $drone_hangar_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
}
